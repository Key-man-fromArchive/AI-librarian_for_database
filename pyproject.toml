[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-librarian-for-database"
version = "0.1.0"
description = "A portable, database-grounded AI librarian: cited answers over your own data, with abstention and governed memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["rag", "llm", "citations", "pgvector", "fastapi", "sse", "grounding"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core has no runtime dependencies at all — that is the point. Everything
# below is an adapter concern.
dependencies = []

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0", "asyncpg>=0.29"]
http = ["httpx>=0.27"]
fastapi = ["fastapi>=0.110", "pydantic>=2.6"]
all = ["sqlalchemy>=2.0", "asyncpg>=0.29", "httpx>=0.27", "fastapi>=0.110", "pydantic>=2.6"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/Key-man-fromArchive/AI-librarian_for_database"
Issues = "https://github.com/Key-man-fromArchive/AI-librarian_for_database/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/librarian_core", "src/librarian_adapters"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# ARG and BLE are on deliberately: unused arguments and broad excepts are
# usually bugs here, and the few intentional ones carry a justified noqa.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ARG", "BLE"]
ignore = [
  # Long lines inside prompt strings are intentional: reflowing them changes
  # the tokens the model sees.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# Stub adapters must accept the whole port signature whether or not they use
# every argument — that is protocol conformance, not dead code.
"tests/*" = ["S101", "ARG002", "ARG005"]
"examples/*" = ["ARG001", "ARG002", "ARG005"]
"eval/run_eval.py" = ["ARG002"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
